spring.application.name=api
spring.docker.compose.enabled=false

# Database Configuration (Neon DB) — credenciais vêm de variáveis de ambiente,
# nunca hardcoded no repositório. Veja README.md > "Configuração local".
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-login-endpoint=true
springdoc.api-docs.enabled=true

# Armazenamento local de arquivos (fotos de evidência de inspeções)
app.storage.base-path=./storage
